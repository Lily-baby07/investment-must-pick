<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資必選 - 股票篩選系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 頭部 */
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        /* 主要內容區 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        /* 卡片樣式 */
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        /* 輸入表單 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 按鈕 */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 結果顯示 */
        .results {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .result-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-item.good {
            border-left-color: #27ae60;
        }

        .result-item.bad {
            border-left-color: #e74c3c;
        }

        .result-item.warning {
            border-left-color: #f39c12;
        }

        .result-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .result-value {
            color: #666;
            font-size: 0.95em;
        }

        /* 儀表盤 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-box h3 {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-box.good .number {
            color: #27ae60;
        }

        .stat-box.bad .number {
            color: #e74c3c;
        }

        /* 圖表 */
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .chart-title {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 250px;
            gap: 15px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px 8px 0 0;
            position: relative;
            min-height: 40px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .bar:hover {
            filter: brightness(1.1);
        }

        .bar-label {
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.9em;
            color: #333;
        }

        .bar-value {
            position: absolute;
            top: -30px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }

            header h1 {
                font-size: 1.8em;
            }
        }

        /* 警告和成功提示 */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        /* 頁尾 */
        footer {
            background: white;
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            color: #666;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頭部 -->
        <header>
            <h1>📈 投資必選</h1>
            <p>智能股票篩選系統 - 避免買到不好的股票</p>
        </header>

        <!-- 儀表盤統計 -->
        <div class="dashboard">
            <div class="stat-box">
                <h3>掃描股票</h3>
                <div class="number">1,234</div>
            </div>
            <div class="stat-box good">
                <h3>優質股票</h3>
                <div class="number">456</div>
            </div>
            <div class="stat-box bad">
                <h3>風險股票</h3>
                <div class="number">289</div>
            </div>
            <div class="stat-box">
                <h3>平均評分</h3>
                <div class="number">7.2</div>
            </div>
        </div>

        <!-- 主要內容 -->
        <div class="main-content">
            <!-- 股票查詢卡片 -->
            <div class="card">
                <h2>🔍 股票查詢</h2>
                <div id="queryAlert" class="alert"></div>
                
                <div class="form-group">
                    <label for="stockCode">股票代碼</label>
                    <input type="text" id="stockCode" placeholder="例如: 600519" maxlength="10">
                </div>

                <div class="form-group">
                    <label for="stockName">股票名稱</label>
                    <input type="text" id="stockName" placeholder="例如: 貴州茅台" readonly>
                </div>

                <button class="btn" onclick="searchStock()">查詢股票</button>

                <div id="queryResults" class="results" style="display: none;">
                    <div class="result-item">
                        <div class="result-label">股票代碼</div>
                        <div class="result-value" id="resultCode">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">股票名稱</div>
                        <div class="result-value" id="resultName">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">當前價格</div>
                        <div class="result-value" id="resultPrice">-</div>
                    </div>
                </div>
            </div>

            <!-- 風險評估卡片 -->
            <div class="card">
                <h2>⚠️ 風險評估</h2>
                <div id="riskAlert" class="alert"></div>

                <div class="form-group">
                    <label for="peRatio">市盈率 (P/E)</label>
                    <input type="number" id="peRatio" placeholder="輸入市盈率" step="0.1">
                </div>

                <div class="form-group">
                    <label for="debtRatio">負債率 (%)</label>
                    <input type="number" id="debtRatio" placeholder="輸入負債率" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="roi">淨資產收益率 (%)</label>
                    <input type="number" id="roi" placeholder="輸入ROE" min="0" max="100">
                </div>

                <button class="btn" onclick="assessRisk()">評估風險</button>

                <div id="riskResults" class="results" style="display: none;">
                    <div class="result-item" id="riskScoreBox">
                        <div class="result-label">風險評分</div>
                        <div class="result-value" id="resultScore">-</div>
                    </div>
                    <div class="result-item" id="riskLevelBox">
                        <div class="result-label">風險等級</div>
                        <div class="result-value" id="resultLevel">-</div>
                    </div>
                    <div class="result-item" id="recommendationBox">
                        <div class="result-label">建議</div>
                        <div class="result-value" id="resultRecommendation">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 圖表區域 -->
        <div class="chart-container">
            <div class="chart-title">📊 最近30天股票評分分布</div>
            <div class="chart">
                <div class="bar" style="height: 65%;" title="優秀">
                    <div class="bar-value">65</div>
                    <div class="bar-label">優秀</div>
                </div>
                <div class="bar" style="height: 45%;" title="良好">
                    <div class="bar-value">45</div>
                    <div class="bar-label">良好</div>
                </div>
                <div class="bar" style="height: 38%;" title="一般">
                    <div class="bar-value">38</div>
                    <div class="bar-label">一般</div>
                </div>
                <div class="bar" style="height: 28%;" title="風險">
                    <div class="bar-value">28</div>
                    <div class="bar-label">風險</div>
                </div>
                <div class="bar" style="height: 15%;" title="非常風險">
                    <div class="bar-value">15</div>
                    <div class="bar-label">非常風險</div>
                </div>
            </div>
        </div>

        <!-- 頁尾 -->
        <footer>
            <p>© 2024 投資必選 - 智能股票篩選系統 | 免責聲明: 本系統僅供參考，不構成投資建議</p>
        </footer>
    </div>

    <script>
        // 模擬股票數據
        const stockDatabase = {
            '600519': { name: '貴州茅台', price: 1856.50 },
            '000858': { name: '五糧液', price: 89.45 },
            '601398': { name: '工商銀行', price: 5.23 },
            '000651': { name: '格力電器', price: 23.55 },
            '300750': { name: '宁德時代', price: 145.30 }
        };

        // 查詢股票
        function searchStock() {
            const code = document.getElementById('stockCode').value.trim();
            const alertBox = document.getElementById('queryAlert');
            const resultsBox = document.getElementById('queryResults');

            if (!code) {
                showAlert(alertBox, '請輸入股票代碼', 'error');
                resultsBox.style.display = 'none';
                return;
            }

            if (stockDatabase[code]) {
                const stock = stockDatabase[code];
                document.getElementById('resultCode').textContent = code;
                document.getElementById('resultName').textContent = stock.name;
                document.getElementById('resultPrice').textContent = '¥' + stock.price.toFixed(2);
                document.getElementById('stockName').value = stock.name;
                
                showAlert(alertBox, '✓ 查詢成功！', 'success');
                resultsBox.style.display = 'block';
            } else {
                showAlert(alertBox, '❌ 未找到該股票，請檢查代碼', 'error');
                resultsBox.style.display = 'none';
            }
        }

        // 風險評估
        function assessRisk() {
            const peRatio = parseFloat(document.getElementById('peRatio').value);
            const debtRatio = parseFloat(document.getElementById('debtRatio').value);
            const roi = parseFloat(document.getElementById('roi').value);
            const alertBox = document.getElementById('riskAlert');
            const resultsBox = document.getElementById('riskResults');

            if (isNaN(peRatio) || isNaN(debtRatio) || isNaN(roi)) {
                showAlert(alertBox, '請填寫所有必填欄位', 'error');
                resultsBox.style.display = 'none';
                return;
            }

            // 計算評分 (0-10)
            let score = 10;
            let risks = [];

            // 市盈率評估 (正常15-25)
            if (peRatio > 30) {
                score -= 2;
                risks.push('市盈率過高');
            } else if (peRatio < 8) {
                score -= 1;
                risks.push('市盈率過低');
            }

            // 負債率評估 (正常30-50%)
            if (debtRatio > 70) {
                score -= 2.5;
                risks.push('負債率過高');
            } else if (debtRatio > 50) {
                score -= 1;
                risks.push('負債率偏高');
            }

            // ROE評估 (正常15%以上)
            if (roi < 8) {
                score -= 2;
                risks.push('盈利能力弱');
            } else if (roi < 12) {
                score -= 1;
                risks.push('盈利能力一般');
            }

            score = Math.max(0, Math.min(10, score));

            // 確定風險等級
            let level, recommendation, colorClass;
            if (score >= 8) {
                level = '✓ 低風險 (優秀)';
                recommendation = '建議買入';
                colorClass = 'good';
            } else if (score >= 6) {
                level = '△ 中低風險 (良好)';
                recommendation = '可以考慮';
                colorClass = 'warning';
            } else if (score >= 4) {
                level = '⚠ 中風險 (一般)';
                recommendation = '謹慎投資';
                colorClass = 'warning';
            } else {
                level = '✗ 高風險 (不推薦)';
                recommendation = '建議迴避';
                colorClass = 'bad';
            }

            // 顯示結果
            document.getElementById('resultScore').textContent = score.toFixed(1) + '/10';
            document.getElementById('resultLevel').textContent = level;
            document.getElementById('resultRecommendation').textContent = recommendation + (risks.length > 0 ? '\n風險: ' + risks.join(', ') : '');

            // 設定顏色
            document.getElementById('riskScoreBox').className = 'result-item ' + colorClass;
            document.getElementById('riskLevelBox').className = 'result-item ' + colorClass;
            document.getElementById('recommendationBox').className = 'result-item ' + colorClass;

            showAlert(alertBox, '✓ 評估完成！', 'success');
            resultsBox.style.display = 'block';
        }

        // 顯示提示
        function showAlert(element, message, type) {
            element.textContent = message;
            element.className = 'alert show ' + type;
            setTimeout(() => {
                element.classList.remove('show');
            }, 3000);
        }

        // 回車鍵提交
        document.getElementById('stockCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchStock();
        });

        document.getElementById('roi').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') assessRisk();
        });
    </script>
</body>
</html>
